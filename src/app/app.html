<!--
  app.html — the app shell. Header (brand + nav + login/logout) stays on every
  page; the current page renders inside <router-outlet />.
-->
<header class="app-header">
  <div class="brand">India Insurance</div>

  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <!-- Link to the protected page. Clicking it when logged out sends you to login. -->
    <a routerLink="/profile" routerLinkActive="active">Profile</a>
  </nav>

  <div class="auth-actions">
    @if (auth.isLoading$ | async) {
      <span class="muted">...</span>
    } @else if (auth.isAuthenticated$ | async) {
      <button class="btn" (click)="logout()">Log out</button>
    } @else {
      <button class="btn" (click)="login()">Log in</button>
    }
  </div>
</header>

<!-- The matched page component is rendered here. -->
<main class="app-main">
  <router-outlet />
</main>
